[project]
name = "astroworld"
version = "0.1.0"
description = "Orbital mechanics simulator with JPL Horizons data comparison"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "astroquery>=0.4.7",
    "astropy>=6.0",
    "numba>=0.64.0",
    "photutils>=2.3.0",
    "scipy>=1.17.0",
    "reproject>=0.13",
]

[project.optional-dependencies]
jit = ["numba>=0.63"]
imaging = ["photutils>=1.10", "scipy>=1.12"]
ml = [
    "torch>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astroworld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests that take >1 min to run (e.g. Mercury precession)",
    "ml: tests requiring PyTorch (torch)",
    "network: tests requiring network access (JPL Horizons, SkyView)",
]
